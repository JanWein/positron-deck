name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run mapping
      - run: git diff --exit-code -- docs/KEYBINDINGS.md streamdeck
      - run: xvfb-run -a npm run test:integration
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: positron-deck-vsix
          path: '*.vsix'

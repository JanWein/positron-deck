" font-family="DejaVu Sans" font-size="33" font-weight="bold" fill="#24352e">Custom workflow</text><text x="1302" y="550" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#24352e">Choose your steps</text><text x="1302" y="608" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#24352e">Wait for tasks to finish successfully</text><text x="96" y="814" font-family="DejaVu Sans" font-size="28" font-weight="normal" fill="#24352e">Custom workflows show their steps for confirmation before they run.</text></svg>